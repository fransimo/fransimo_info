title: Fran Simó
baseURL: https://fransimo.info/
pagination:
  pagerSize: 100
enableRobotsTXT: true
timeout: 120

theme: ["hugo-book", "hugo-photoswipe5-gallery"]

module:
  # uncomment line below for temporary local development of module
  # replacements: "github.com/CaiJimmy/hugo-theme-stack/v3 -> ../../hugo-theme-stack"
  # imports:
  #  - path: github.com/alex-shpak/hugo-book
  #    disable: false

relativeURLs: false
removePathAccents: true
# https://gohugo.io/content-management/urls/#permalinks
permalinks:
  page:
     posts: /var/log/:year/:month/:day/:slug/
     # tutorials: /training/:slug/
  section:
    posts: /var/log/
    # tutorials: /training/

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
    en:
        label: English
        title: Fran Simó
        params:
          subtitle: Art, presence and code to walk the path together.
        weight: 1
        contentDir: content
        locale: en-US

    es:
        label: Español
        title: Fran Simó
        params:
          subtitle: Arte, presencia y código para recorrer juntos el camino.
        weight: 2
        contentDir: content
        locale: es-ES
    ca:
      label: Català
      title: Fran Simó
      params:
        subtitle: Art, presència i codi per caminar junts pel camí.
      weight: 2
      contentDir: content
      locale: ca-ES
    it:
      label: Italiano
      title: È dentro di tutti noi
      weight: 3


# Book configuration
disablePathToLower: true
enableGitInfo: true

outputFormats:
  PublishDataJSON:
    mediaType: application/json
    baseName: publish_data
    isPlainText: true
    notAlternative: true
  txt:
    mediaType: "text/plain"
    baseName: "source"
    isPlainText: true

outputs:
  home: ["html", "txt", "rss", "PublishDataJSON"]
  page: ["html", "txt"]
  section: ["html", "txt"]

# Images
imaging:
  quality: 78
  resampleFilter: Lanczos
  hint: photo

# Needed for mermaid/katex shortcodes
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true

  tableOfContents:
    startLevel: 1

  highlight:
    style: base16-snazzy


# Multi-lingual mode config
# There are different options to translate files
# See https://gohugo.io/content-management/multilingual/#translation-by-filename
# And https://gohugo.io/content-management/multilingual/#translation-by-content-directory


menu:
#  before: []
#  after:
#    - name: "github"
#      url: "https://github.com/fransimo"
#      weight: 10
#      params:
#        icon: brand-github
#    - name: "instagram"
#      url: "https://instagram.com/fransimo"
#      weight: 20
#      params:
#        icon: brand-instagram


params:
  # (Optional, default light) Sets color theme: light, dark or auto.
  # Theme 'auto' switches between dark and light modes based on browser/os preferences
  BookTheme: "light"

  # (Optional, default true) Controls table of contents visibility on right side of pages.
  # Start and end levels can be controlled with markup.tableOfContents setting.
  # You can also specify this parameter per page in front matter.
  BookToC: false

  # (Optional, default favicon.png) Set the path to a favicon file.
  # If the favicon is /static/favicon.png then the path would be favicon.png
  # BookFavicon: "favicon.png"

  # (Optional, default none) Set the path to a logo for the book.
  # If the logo is /static/logo.png then the path would be logo.png
  # BookLogo: /logo.png

  # (Optional, default none) Set leaf bundle to render as side menu
  # When not specified file structure and weights will be used
  # BookMenuBundle: /menu

  # (Optional, default docs) Specify root page to render child pages as menu.
  # Page is resoled by .GetPage function: https://gohugo.io/functions/getpage/
  # For backward compatibility you can set '*' to render all sections to menu. Acts same as '/'
  BookSection: docs

  # Set source repository location.
  # Used for 'Last Modified' and 'Edit this page' links.
  # bookRepo: https://github.com/fransimo/fransimo_info

  # (Optional, default 'commit') Specifies commit portion of the link to the page's last modified
  # commit hash for 'doc' page type.
  # Requires 'BookRepo' param.
  # Value used to construct a URL consisting of BookRepo/BookCommitPath/<commit-hash>
  # Github uses 'commit', Bitbucket uses 'commits'
  #BookCommitPath: commit

  # Enable "Edit this page" links for 'doc' page type.
  # Disabled by default. Uncomment to enable. Requires 'BookRepo' param.
  # Edit path must point to root directory of repo.
  # BookEditPath: edit/main

  # Configure the date format used on the pages
  # - In git information
  # - In blog posts
  BookDateFormat: "January 2, 2006"

  # (Optional, default true) Enables search function with flexsearch,
  # Index is built on fly, therefore it might slowdown your website.
  # Configuration for indexing can be adjusted in i18n folder per language.
  BookSearch: true

  # (Optional, default true) Enables comments template on pages
  # By default partals/docs/comments.html includes Disqus template
  # See https://gohugo.io/content-management/comments/#configure-disqus
  # Can be overwritten by same param in page frontmatter
  BookComments: false

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables portable links and link checks in markdown pages.
  # Portable links meant to work with text editors and let you write markdown without {{< relref >}} shortcode
  # Theme will print warning if page referenced in markdown does not exists.
  BookPortableLinks: true

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables service worker that caches visited pages and resources for offline use.
  BookServiceWorker: true

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables a drop-down menu for translations only if a translation is present.
  BookTranslatedOnly: false

  gallery:
    useExif: false
    sort: asc

  # https://gohugo.io/templates/embedded/#configuration-open-graph
  images:
  - https://fransimo.info/docs/presence/fransimo_therapies.png

  # Organization info used for publisher/provider + logo
  author:
    name: "Fran Simó"

  organization:
    name: "Fran Simó"
    type: "Organization"
    # Use an absolute URL for best results
    logo: "https://fransimo.info/docs/presence/fransimo_therapies.png"

  # Default service area (used when a Service page has no areaServed)
  defaultArea:
    - "Barcelona"
    - "Istanbul"

  # Optional: knobs specifically for the ldjson partial
  ldjson:
    # Default platforms for potentialAction EntryPoints (if page omits actionPlatform)
    actionPlatform:
      - "http://schema.org/DesktopWebPlatform"
      - "http://schema.org/MobileWebPlatform"

    # Path used by WebSite.SearchAction (joined to baseURL).
    # Keep it RELATIVE (no leading slash) to avoid double slashes.
    searchPath: "search/?q={search_term_string}"


