<script type="application/ld+json">

{{ $description_text := "" }}
{{ if isset .Params "description" }}
  {{ $description_text = .Description }}
{{ else }}
  {{ $description_text = .Summary }}
{{ end }}

{{ $icon_url := "" }}
{{ range first 1 (.Resources.ByType "image") }}
    {{ $icon_url = .Permalink }}
{{ end }}
{{ if eq $icon_url "" }}
    {{ $icon_url =  index .Site.Params.images 0 }}
{{ end }}

{{ $schema_name := "" }}
{{ if isset .Params "schemaorgname" }}
  {{ $schema_name = .Params.schemaOrgName  }}
{{ else }}
  {{ $schema_name = .Title }}
{{ end }}

{{ if eq .Section "posts" }}
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title }},
  "image": {{ $icon_url }},
  "datePublished": {{ .PublishDate }},
  "dateModified": {{ .Lastmod }},
  "author": {
    "@type": "Person",
    "name": {{ .Site.Params.schema_org.name }},
    "sameAs": {{ .Site.BaseURL }}
  },
  "description": {{ $description_text | plainify | safeHTML }},
  "keywords": [{{ range $i, $e := .Params.tags }}{{ if $i }}, {{ end }}{{ $e }}{{ end }}]
}
{{ end }}

{{ if eq .Section "docs" }}
{
  "@context": "https://schema.org",
  {{ if isset .Params "schemaorgtype" }}
  "@type": {{ .Params.schemaOrgType }},
  {{ else }}
  "@type": "VisualArtwork",
  {{ end }}
  "name": {{ $schema_name }},
  "image": {{ $icon_url | absURL }},
  {{ if isset .Params "dateCreated" }}
  "dateCreated": {{ .Params.dateCreated }},
  {{end}}
  {{ if isset .Params "artform" }}
  "artform": {{ .Params.artForm }},
  {{end}}
  {{ if isset .Params "isbn" }}
  "isbn": {{ .Params.isbn }},
  {{end}}


  {{ if isset .Params "schemaorgtype" }}
        {{ if eq .Params.schemaOrgType "Person" }}
          {{ if isset .Params "schemaorgjobtitle" }}
            "jobTitle": {{ .Params.schemaOrgJobTitle }},
          {{end}}
          {{ if isset .Params "schemaorgknowslanguage" }}
            "knowsLanguage": {{ .Params.schemaOrgKnowsLanguage }},
          {{end}}
          {{ if isset .Params "schemaorgsameas" }}
            "sameAs": {{ .Params.schemaOrgSameAs }},
          {{end}}
        {{ else }}
              "author": {
                "@type": "Person",
                "name": {{ .Site.Params.schema_org.name }},
                "sameAs": {{ .Site.BaseURL }}
              },
          {{end}}
  {{end}}
  "description": {{ $description_text | plainify | safeHTML }}
}
{{ end }}

{{ if eq .Section "" }}
{
  "@context": "https://schema.org",
  "@type": "{{ .Site.Params.schema_org.type }}",
  "name": {{ .Site.Params.schema_org.name }},
  "url": {{ .Site.BaseURL }},
  "logo": {{ .Site.Params.schema_org.image }},
  "sameAs": {{ .Site.Params.schema_org.sameAs }},
  "department": [
    {

}
{{ end }}
</script>
